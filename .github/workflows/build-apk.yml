name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Generate Official Release Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.jks -alias meshgram -keyalg RSA -keysize 2048 -validity 10000 -storepass meshgram_secret_key_2026 -keypass meshgram_secret_key_2026 -dname "CN=MeshGram, OU=Security, O=MeshGram, L=Tehran, ST=Tehran, C=IR"

    - name: Make Gradlew Executable
      run: |
        sed -i 's/\r$//' ./gradlew
        chmod +x ./gradlew

    - name: Build Signed Release APK with R8 Obfuscation
      run: |
        ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeshGram-Signed-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 14

    - name: Create GitHub Release with Signed APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "MeshGram v1.0.0 Signed Release APK"
        body: "نسخه رسمی و امضاشده MeshGram با رمزنگاری سرتاسری E2EE، رله با دانش صفر، انتقال مستقیم پرسرعت فایل، و استوری ۲۴ ساعته"
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
